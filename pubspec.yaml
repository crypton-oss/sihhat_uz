name: sihhat_uz
description: "Sihhat UZ - Tibbiyot ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_lucide: ^1.37.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  mask_text_input_formatter: ^2.8.0
  http: ^1.2.1
  pinput: ^6.0.2
  intl: ^0.19.0
  supabase_flutter: ^2.6.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/profile-circle.svg

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Variable.ttf
